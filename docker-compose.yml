version: '3'
services:
  web:
    image: nginx
    ports:
      - "8080:80"
    networks:
      - appnet


  db:  
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet   

volumes:
  dbdata:

networks:
  appnet:              
